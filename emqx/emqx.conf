## EMQX 5.8 broker for Veepoo 4G watches (VitalVue).
## Secrets, URLs and certificate paths are overridden per environment with EMQX_<PATH>
## variables ("__" separates levels, array items are 1-based), set in docker-compose.yml:
##   EMQX_NODE__COOKIE, EMQX_AUTHENTICATION__1__HEADERS, EMQX_AUTHORIZATION__SOURCES__1__HEADERS,
##   EMQX_LISTENERS__SSL__DEFAULT__SSL_OPTIONS__CERTFILE / __KEYFILE, …__URL (tests only)

node {
  name = "emqx@127.0.0.1"
  cookie = "vitalvue-emqx-cookie"
  data_dir = "data"
}

cluster {
  name = vitalvue
  discovery_strategy = manual
}

## Dashboard: never publish port 18083 publicly — reach it through an SSH tunnel.
dashboard {
  listeners.http.bind = 18083
}

## 1883: plain MQTT, used by the mqtt-worker inside the Docker network (and vendor tests only).
listeners.tcp.default {
  bind = "0.0.0.0:1883"
  max_connections = 10000
}

## 8883: MQTT over TLS for the watches. Defaults are EMQX's bundled self-signed test
## certificate; production overrides the paths to the mounted real certificate.
listeners.ssl.default {
  bind = "0.0.0.0:8883"
  max_connections = 10000
  ssl_options {
    certfile = "/opt/emqx/etc/certs/cert.pem"
    keyfile = "/opt/emqx/etc/certs/key.pem"
  }
}

## Watch + worker logins are checked by the VitalVue API (username = clientId, bcrypt password).
authentication = [
  {
    mechanism = password_based
    backend = http
    enable = true
    method = post
    url = "http://backend:8000/api/v1/internal/emqx/auth"
    body {
      username = "${username}"
      password = "${password}"
      clientid = "${clientid}"
    }
    headers {
      "content-type" = "application/json"
      "x-emqx-secret" = "not-set"   # overridden via env; the API rejects "not-set"
    }
    request_timeout = "5s"
  }
]

## Each watch may only publish vpwatch/{its clientId}/v1/# and subscribe server/{its clientId}/v1/#.
## The worker is a superuser (returned by the auth hook) and bypasses these checks.
authorization {
  no_match = deny
  deny_action = disconnect
  cache { enable = true, max_size = 64, ttl = "5m" }
  sources = [
    {
      type = http
      enable = true
      method = post
      url = "http://backend:8000/api/v1/internal/emqx/authz"
      body {
        username = "${username}"
        clientid = "${clientid}"
        topic = "${topic}"
        action = "${action}"
      }
      headers {
        "content-type" = "application/json"
        "x-emqx-secret" = "not-set"   # overridden via env; the API rejects "not-set"
      }
      request_timeout = "5s"
    }
  ]
}

## Connect / disconnect events on $SYS: the worker uses them for online status, sending the
## time + pending schedules on connect, and spotting duplicate clientId logins.
sys_topics {
  sys_event_messages {
    client_connected = true
    client_disconnected = true
  }
}

mqtt {
  max_packet_size = "4KB"      # protocol payloads are ≤ 1500 bytes
}
