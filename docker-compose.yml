services:
  db:
    image: postgres:15.5-alpine
    container_name: vitalvue_db
    # ports:
    #   - "5432:5432"
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_DB: ${DB_NAME}
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}" ]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - vitalvue_net
    restart: unless-stopped

  redis:
    image: redis:7.2-alpine
    container_name: vitalvue_redis
    ports:
      - "6379:6379"
    command: >
      redis-server --requirepass ${REDIS_PASS}  --rename-command FLUSHALL ""  --save 60 1
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "${REDIS_PASS}", "ping" ]
      interval: 5s
      retries: 5
    volumes:
      - redis_data:/data
    networks:
      - vitalvue_net

  backend:
    build: ./backend
    container_name: vitalvue_backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    env_file: .env
    environment:
      - DATABASE_URL=postgresql://${DB_USER}:${DB_PASS}@db:5432/${DB_NAME}
      - REDIS_URL=redis://:${REDIS_PASS}@redis:6379/0
      # Heartbeat + baseline jobs run once, in the `scheduler` service below.
      - RUN_BACKGROUND_JOBS=false
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    networks:
      - vitalvue_net

  # Heartbeat (device offline) + baseline jobs — exactly one instance.
  scheduler:
    build: ./backend
    container_name: vitalvue_scheduler
    command: python -m app.scheduler
    env_file: .env
    environment:
      - DATABASE_URL=postgresql://${DB_USER}:${DB_PASS}@db:5432/${DB_NAME}
      - REDIS_URL=redis://:${REDIS_PASS}@redis:6379/0
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    networks:
      - vitalvue_net
    restart: unless-stopped

  # MQTT broker for Veepoo 4G watches. Watches connect on 8883 (TLS); 1883 stays inside the
  # Docker network for the worker. The dashboard (18083) is bound to localhost only — use an
  # SSH tunnel: ssh -L 18083:localhost:18083 ubuntu@<server>
  emqx:
    image: emqx/emqx:5.8.6
    container_name: vitalvue_emqx
    ports:
      - "8883:8883"
      - "127.0.0.1:18083:18083"
    # Config overrides use EMQX_<PATH> (levels joined by "__", array items 1-based).
    environment:
      - EMQX_NODE__COOKIE=${EMQX_NODE_COOKIE}
      - EMQX_DASHBOARD__DEFAULT_PASSWORD=${EMQX_DASHBOARD_PASS}
      - 'EMQX_AUTHENTICATION__1__HEADERS={"content-type" = "application/json", "x-emqx-secret" = "${EMQX_HOOK_SECRET}"}'
      - 'EMQX_AUTHORIZATION__SOURCES__1__HEADERS={"content-type" = "application/json", "x-emqx-secret" = "${EMQX_HOOK_SECRET}"}'
      # TLS certificate for the broker host (for now vitalvue-api.genesysailabs.com, reusing its
      # certbot certificate), copied into ./emqx/certs on the server BEFORE deploying. If the files
      # are missing only EMQX fails to start — BLE and the API are unaffected.
      - EMQX_LISTENERS__SSL__DEFAULT__SSL_OPTIONS__CERTFILE=/opt/emqx/etc/certs/vitalvue/fullchain.pem
      - EMQX_LISTENERS__SSL__DEFAULT__SSL_OPTIONS__KEYFILE=/opt/emqx/etc/certs/vitalvue/privkey.pem
    ulimits:
      nofile: { soft: 65536, hard: 65536 }
    volumes:
      - emqx_data:/opt/emqx/data
      - ./emqx/emqx.conf:/opt/emqx/etc/emqx.conf:ro
      - ./emqx/certs:/opt/emqx/etc/certs/vitalvue:ro
    depends_on:
      - backend
    networks:
      - vitalvue_net
    restart: unless-stopped

  # The single process that receives watch traffic (never run inside the API: an MQTT
  # subscription gets every message, so N API workers would store each reading N times).
  mqtt-worker:
    build: ./backend
    container_name: vitalvue_mqtt_worker
    command: python -m app.mqtt.worker
    env_file: .env
    environment:
      - DATABASE_URL=postgresql://${DB_USER}:${DB_PASS}@db:5432/${DB_NAME}
      - REDIS_URL=redis://:${REDIS_PASS}@redis:6379/0
      - MQTT_HOST=emqx
      - MQTT_PORT=1883
    depends_on:
      - emqx
      - db
      - redis
    networks:
      - vitalvue_net
    restart: unless-stopped

  # TCP server for the Wonlex and CLOC BPW8 4G watches (they don't use MQTT). Exactly one
  # instance: it holds every watch's connection. Open 7700 (Wonlex) and 7701 (BPW8) in the
  # security group. BPW8 watches are pointed at the server's IP by SMS, so that IP must never
  # change (Elastic IP); Wonlex watches use a DNS-only host name (not CloudFront).
  device-gateway:
    build: ./backend
    container_name: vitalvue_device_gateway
    command: python -m app.gateway
    env_file: .env
    environment:
      - DATABASE_URL=postgresql://${DB_USER}:${DB_PASS}@db:5432/${DB_NAME}
      - REDIS_URL=redis://:${REDIS_PASS}@redis:6379/0
    ports:
      - "7700:7700"
      - "7701:7701"
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    networks:
      - vitalvue_net
    restart: unless-stopped

  # frontend:
  #   build: ./frontend
  #   container_name: vitalvue_frontend
  #   networks:
  #     - vitalvue_net

  # Optional: on the EC2 server the host's own nginx serves vitalvue-api.genesysailabs.com
  # (ports 80/443), so this container would only crash-loop there. Start it explicitly on a
  # machine without a host nginx:  docker compose --profile docker-nginx up -d
  nginx:
    profiles: ["docker-nginx"]
    image: nginx:alpine
    container_name: vitalvue_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend:/usr/share/nginx/html:ro
    depends_on:
      # - frontend
      - backend
    networks:
      - vitalvue_net
    restart: always

networks:
  vitalvue_net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  emqx_data:
